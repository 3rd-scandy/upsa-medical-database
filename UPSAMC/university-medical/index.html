<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UPSAMC Medical Portal - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo">🏥</div>
    <h1>UPSAMC Medical Portal</h1>
    <p class="subtitle">Authorized Medical Staff Only</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="staffName">Staff Name</label>
        <input type="text" type="select" id="staffName" placeholder="Enter your full name" required />
      </div>
      <div class="form-group">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" placeholder="Enter passcode" required />
      </div>
      <div id="loginError" class="error-msg hidden">Invalid passcode. Access denied.</div>
      <button type="submit" class="btn btn-primary">Access Portal</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
